[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "party-matching-poc"
version = "0.1.0"
requires-python = ">=3.9,<3.14"
dependencies = [
  "tomli>=2,<3; python_version < '3.11'",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "XlsxWriter>=3.2,<4",
  "scikit-learn>=1.5,<2",
  "rapidfuzz>=3.9,<4",
  "joblib>=1.4,<2",
  "sparse-dot-topn>=1.2,<2",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3,<3",
  "sentence-transformers>=3,<6",
  "usearch>=2.16,<3",
]
llm = ["openai>=1.40,<3", "python-dotenv>=1,<2"]
all = [
  "torch>=2.3,<3",
  "sentence-transformers>=3,<6",
  "usearch>=2.16,<3",
  "openai>=1.40,<3",
  "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
