[account]
id = "poc-account"

[paths]
prepared_dir = "data/prepared"
state_dir = "state"
artifacts_dir = "artifacts"
outputs_dir = "outputs"
prompt = "prompts/party_expansion_v1.txt"

[workbook]
detail_sheet = "Detail"
raw_name_column = "Raw Name (original)"
canonical_name_column = "Resolved (Canonical) Name"
category_column = "Category"

[expansion]
mode = "off" # off | cache_only | azure
version = "v2"
batch_size = 10
workers = 4
timeout_seconds = 30
max_retries = 2
minimum_candidate_confidence = 0.70
minimum_parent_confidence = 0.85

[retrieval]
# These caps limit competing verified roots per ADM mention, not the number of
# ADM rows that may match one verified party.
max_roots_per_mention = 50
max_variants_per_root = 2
identity_batch_size = 50000
word_tfidf_enabled = true
char_tfidf_enabled = true
rrf_enabled = true
rrf_k = 60
word_min_score = 0.18
char_min_score = 0.28
embedding_top_k = 100
lexical_min_score = 0.28
embedding_min_score = 0.42
embedding_enabled = false
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_model_path = ""
ann_backend = "usearch" # usearch | brute

[matching]
connector_policy = "positional" # positional | legacy
strategy = "selective_hybrid" # feature | selective_hybrid
cross_encoder_mode = "ambiguous" # off | ambiguous | all_shortlisted
cross_encoder_model = "cross-encoder/ms-marco-MiniLM-L6-v2"
ambiguous_low = 0.55
ambiguous_high = 0.98
ambiguous_margin = 0.08
rerank_top_k = 5
minimum_root_margin = 0.04
confidence_batch_size = 50000
preferred_near_cutoff_band = 0.03
distinctive_token_guard = true
digit_conflict_guard = true
directional_coverage_threshold = 0.90
directional_jaccard_threshold = 0.45

[decision]
precision_target = 0.98
request_confidence_cutoff = 0.0
fallback_system_threshold = 0.90
minimum_calibration_matches = 100
calibration_method = "isotonic" # isotonic | none
rules_plain_threshold = 0.80 # rules-only comparison, plain names; connector recovery below is separate
rules_enhanced_enabled = true # guarded views + root-unique short names, rules-only; false restores previous behavior
rules_connector_short_name_enabled = true # rules-only: a unique official-name prefix (one or more words) may validate an OBO/VIA segment below cutoff
rules_multiword_prefix_enabled = true # new extension; false keeps the previous single-token recovery while leaving other enhanced rules intact
rules_second_pass_enabled = true # remaining plain NO_MATCH rows: scan retrieved roots for one unambiguous structural name match; false restores prior enhanced rules
rules_identity_tiebreak_enabled = true # second-pass only: unique explicit legal form or full-name &/and equivalence; false restores the prior second pass
rules_regional_enabled = true # optional final regional qualifier route for remaining plain NO_MATCH rows; false keeps every pre-regional rules decision
rules_multipart_enabled = true # optional forced choice for strong competing plain-name fragments; false restores enhanced rules exactly
rules_multipart_min_confidence = 0.80 # independent safety floor; lower this and rules_plain_threshold only if later evidence supports it
rules_verified_anchor_enabled = true # final plain NO_MATCH recovery from a unique verified-name prefix/base; false restores pre-anchor rules
rules_containment_enabled = true # set false to compare against the plain-cutoff baseline
rules_containment_min_confidence = 0.40
rules_containment_min_margin = 0.08
rules_containment_min_lexical = 0.50
rules_containment_max_token_df = 3

[execution]
mode = "parallel" # serial | parallel
workers = 10
native_threads = 10
seed = 42

[training]
max_identity_pairs = 100000
negative_ratio = 3
train_cross_encoder = false
cross_encoder_epochs = 1
cross_encoder_batch_size = 32
